name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # @kosa8/ai-sdk-sandbox type-checks against @kosa8/sdk's built types.
      - run: npm run build
      - run: npm run typecheck
      - name: "@kosa8/sdk"
        run: npm test -w @kosa8/sdk
      # The adapter tests run the "sandbox" commands on the host (sh and
      # friends) to stand in for a container, so they need a POSIX host.
      - name: "@kosa8/ai-sdk-sandbox"
        if: runner.os != 'Windows'
        run: npm test -w @kosa8/ai-sdk-sandbox
